<script>
  (function () {
    const overlay = document.getElementById('logout-dialog-overlay');
    const card = document.getElementById('logout-modal-card');
    const cancelBtn = document.getElementById('cancel-logout-btn');
    const closeBtn = document.getElementById('close-modal-btn');
    const confirmBtn = document.getElementById('confirm-logout-btn');

    function dismissModal() {
      if (!overlay || !card) return;
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      overlay.classList.remove('opacity-100');
      overlay.classList.add('opacity-0', 'pointer-events-none');
    }

    if (cancelBtn) cancelBtn.addEventListener('click', dismissModal);
    if (closeBtn) closeBtn.addEventListener('click', dismissModal);

    if (overlay) {
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) {
          dismissModal();
        }
      });
    }

    if (confirmBtn) {
      confirmBtn.addEventListener('click', function () {
        confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[16px] animate-spin">refresh</span><span>正在退出...</span>';
        confirmBtn.classList.add('opacity-80', 'cursor-not-allowed');
        setTimeout(function () {
          window.location.reload();
        }, 600);
      });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        dismissModal();
      }
    });
  })();
