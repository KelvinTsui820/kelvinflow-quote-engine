<script>
  (function() {
    const btnNormal = document.getElementById('btn-view-normal');
    const btnEmpty = document.getElementById('btn-view-empty');
    const normalContent = document.getElementById('normal-quote-content');
    const emptyContent = document.getElementById('empty-quote');

    function setView(view) {
      if (view === 'empty') {
        normalContent.classList.add('hidden');
        emptyContent.classList.remove('hidden');

        // Style switcher: empty active, normal neutral
        btnEmpty.className = "flex items-center gap-1.5 px-3 py-1 rounded-md text-[12px] font-label-md font-semibold transition-all shadow-sm bg-primary text-on-primary";
        btnNormal.className = "flex items-center gap-1.5 px-3 py-1 rounded-md text-[12px] font-label-md font-medium transition-all text-secondary hover:text-on-surface hover:bg-surface-container";
      } else {
        normalContent.classList.remove('hidden');
        emptyContent.classList.add('hidden');

        // Style switcher: normal active, empty neutral
        btnNormal.className = "flex items-center gap-1.5 px-3 py-1 rounded-md text-[12px] font-label-md font-semibold transition-all shadow-sm bg-primary text-on-primary";
        btnEmpty.className = "flex items-center gap-1.5 px-3 py-1 rounded-md text-[12px] font-label-md font-medium transition-all text-secondary hover:text-on-surface hover:bg-surface-container";
      }
    }

    if (btnNormal && btnEmpty) {
      btnNormal.addEventListener('click', () => setView('normal'));
      btnEmpty.addEventListener('click', () => setView('empty'));
    }
  })();
</script>
